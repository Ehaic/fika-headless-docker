# Example docker-compose file to get all required services running for an SPT server and dedicated client
#
# Change the volume mounts to point to the right paths, of course
services:
  # SPT Server container
  spt_server:
    # See https://github.com/Ehaic/fika-spt-server-docker
    # This is my own SPT server image (sp-tushonka SPT 4.1.x compatible), but you can choose to use any other working SPT docker image
    image: ghcr.io/ehaic/fika-spt-server-docker:latest
    container_name: spt_server
    volumes:
      # I like to mount my server files from the host into the container so I can easily add/change mods
      - /host/path/to/serverfiles:/opt/server
    ports:
      - 6969:6969
    # Mark the container as healthy once the server has started
    healthcheck:
      test: ["CMD", "curl", "-f", "--insecure", "https://localhost:6969/launcher/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Dedicated client container
  fika_dedi:
    image: ghcr.io/zhliau/fika-headless-docker:latest
    container_name: fika_dedi
    volumes:
      # Set this to the path on the host to the FIKA client files
      - /host/path/to/fika:/opt/tarkov
    environment:
      - PROFILE_ID=adadadadadadaadadadad
      # Use service name from above, docker-compose resolves this to the SPT server container
      - SERVER_URL=spt_server
      - SERVER_PORT=6969
      # NarcoNet sync: keep client mods in lockstep with the server.
      # Requires the NarcoNet client plugin in the client's BepInEx/plugins
      # (the server's NarcoNet sync profile will serve it on first connect,
      # or install it manually from the NarcoNet release zip).
      - USE_NARCONET=true
      # Optional: only needed if the syncer cannot infer it (it infers
      # "headless" from the Fika headless plugin automatically)
      # - NARCONET_PROFILE=headless
      # Optional: extra CLI args for the syncer, e.g. --delete-removed
      # - NARCONET_SYNC_ARGS=--delete-removed
    # Uncomment for the optional Nvidia GPU support (see Features above).
    # The image no longer bakes NVIDIA_* env vars — set them here so the
    # nvidia runtime injects your GPU at runtime. Requires nvidia-container-toolkit
    # and `runtime: nvidia` (or default-runtime: nvidia on the daemon).
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    #   - NVIDIA_DRIVER_CAPABILITIES=all
    # runtime: nvidia
    # Wait to start the dedicated client until the server is healthy
    depends_on:
      spt_server:
        condition: service_healthy
    ports:
      - 25565:25565/udp

  # Restarter service, to restart the dedicated client at 11 UTC every day
  # Replace "fika_dedi" with the name of your dedicated client container
  restarter:
    image: docker:cli
    container_name: fika_restarter
    restart: unless-stopped
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        echo "Scheduling restart - container start $$(date +'%Y%m%d %H:%M')"
        while true; do
        if [ "$$(date +'%H:%M')" = '11:00' ]; then
        echo "Restarting dedicated container on $$(date +'%H:%M')"
        docker restart fika_dedi
        fi
        sleep 60
        done
